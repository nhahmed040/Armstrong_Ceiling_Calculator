name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Detect Android project directory
        shell: bash
        run: |
          if [[ -f app/build.gradle || -f app/build.gradle.kts ]]; then
            PROJECT_DIR="."
          else
            BUILD_FILE=$(find . -type f \( -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit)
            if [[ -z "$BUILD_FILE" ]]; then
              echo "Could not find app/build.gradle or app/build.gradle.kts" >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building Android project in: $PROJECT_DIR"
      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/app/build/outputs/apk/debug"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$PROJECT_DIR/app/build/outputs/apk/debug/Armstrong_Ceiling_Calculator.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Armstrong-Ceiling-Calculator-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/Armstrong_Ceiling_Calculator.apk
          if-no-files-found: error
