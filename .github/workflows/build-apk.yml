name: Build Armstrong Ceiling Calculator APK from source

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - 'ArmstrongCeilingCalculator/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate V6.6.0 Android project source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="ArmstrongCeilingCalculator"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" || ! -f "$PROJECT_DIR/app/build.gradle" || ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]]; then
            echo "::error::V6.6.0 Android source project is incomplete."
            find . -maxdepth 5 -type f | sort | head -150
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building updated source project directly (not the archived V5.4 ZIP)."
          grep -E "versionCode|versionName" "$PROJECT_DIR/app/build.gradle"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -100

      - name: Validate embedded calculator JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('ArmstrongCeilingCalculator/app/src/main/assets/index.html').read_text()
          start = source.index('<script>') + len('<script>')
          end = source.index('</script>', start)
          Path('/tmp/armstrong-calculator.js').write_text(source[start:end])
          PY
          node --check /tmp/armstrong-calculator.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK from updated V6.6.0 source project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean assembleDebug

      - name: Verify and rename APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not created at $APK"
            find "$PROJECT_DIR" -path '*/build/outputs/apk/*' -type f -print
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/Armstrong_Ceiling_Calculator_v6.6.0.apk
          ls -lh output/Armstrong_Ceiling_Calculator_v6.6.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armstrong-Ceiling-Calculator-v6.6.0-APK
          path: output/Armstrong_Ceiling_Calculator_v6.6.0.apk
          if-no-files-found: error
