name: Build Ceiling and Floor Calculator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP
        run: unzip -q CeilingFloorCalculator_Android_Project.zip -d .

      - name: Build debug APK
        run: gradle --no-daemon -p CeilingFloorCalculator assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeilingFloorCalculator-debug-apk
          path: CeilingFloorCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
