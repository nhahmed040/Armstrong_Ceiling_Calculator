name: Build Armstrong Ceiling Calculator APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - 'ArmstrongCeilingCalculator/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and locate Android project in ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Armstrong_Ceiling_Calculator_Version_5_4_Dimensions_Pan_Zoom.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Expected project ZIP not found: $ZIP_FILE"
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/armstrong-ceiling-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::ZIP does not contain settings.gradle or settings.gradle.kts"
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [[ ! -f "$PROJECT_DIR/app/build.gradle" && ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::Android app module not found beside project settings file: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building Android project extracted from: $ZIP_FILE"
          echo "Project root: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK from extracted ZIP project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" clean assembleDebug

      - name: Verify and rename APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not created at $APK"
            find "$PROJECT_DIR" -path '*/build/outputs/apk/*' -type f -print
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/Armstrong_Ceiling_Calculator_v5.4.apk
          ls -lh output/Armstrong_Ceiling_Calculator_v5.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armstrong-Ceiling-Calculator-v5.4-APK
          path: output/Armstrong_Ceiling_Calculator_v5.4.apk
          if-no-files-found: error
