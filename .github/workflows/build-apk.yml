name: Recover Original Armstrong Ceiling Calculator Source

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Armstrong_Ceiling_Calculator_Version_5_4_Dimensions_Pan_Zoom.zip'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract original project into repository
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/Armstrong_Ceiling_Calculator_Version_5_4_Dimensions_Pan_Zoom.zip"
          test -f "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/recovered"
          test -f "$RUNNER_TEMP/recovered/ArmstrongCeilingCalculator/app/src/main/assets/index.html"
          rm -rf "$GITHUB_WORKSPACE/ArmstrongCeilingCalculator"
          cp -a "$RUNNER_TEMP/recovered/ArmstrongCeilingCalculator" "$GITHUB_WORKSPACE/ArmstrongCeilingCalculator"
          echo "=== ORIGINAL PROJECT FILES ==="
          find ArmstrongCeilingCalculator -type f | sort
          echo "=== ORIGINAL WEB APP SIZE ==="
          wc -l ArmstrongCeilingCalculator/app/src/main/assets/index.html
          git add ArmstrongCeilingCalculator
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Recover original Version 5.4 Android project source"
            git push
          fi
