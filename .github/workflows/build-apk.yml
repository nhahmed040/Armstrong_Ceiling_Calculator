name: Inspect Original Armstrong Ceiling Calculator Project

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect original Version 5.4 ZIP
        shell: bash
        run: |
          set -e
          ARCHIVE="$GITHUB_WORKSPACE/Armstrong_Ceiling_Calculator_Version_5_4_Dimensions_Pan_Zoom.zip"
          test -f "$ARCHIVE"
          echo "=== ARCHIVE DETAILS ==="
          ls -lh "$ARCHIVE"
          echo "=== ARCHIVE FILE LIST ==="
          unzip -l "$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/original-project"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/original-project"
          echo "=== PROJECT TREE ==="
          find "$RUNNER_TEMP/original-project" -maxdepth 5 -type f | sort
          echo "=== BUILD CONFIGURATION FILES ==="
          find "$RUNNER_TEMP/original-project" -type f \\( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' -o -name 'package.json' \\) -print
