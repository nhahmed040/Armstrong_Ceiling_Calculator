
name: Build Armstrong Ceiling Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and detect Android project
        shell: bash
        run: |
          set -e

          # Check whether the project is already extracted.
          APP_GRADLE=$(find . -type f \( \
            -path '*/app/build.gradle' -o \
            -path '*/app/build.gradle.kts' \
          \) -print -quit)

          # If not found, extract the ZIP.
          if [ -z "$APP_GRADLE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d extracted

            APP_GRADLE=$(find extracted -type f \( \
              -path '*/app/build.gradle' -o \
              -path '*/app/build.gradle.kts' \
            \) -print -quit)
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: Android app Gradle file not found."
            find . -maxdepth 5 -type f -name 'build.gradle*' -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Detected project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Armstrong-Ceiling-Calculator-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
