name: Build Original Armstrong Ceiling Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ArmstrongCeilingCalculator/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out original project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate original web calculator JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("ArmstrongCeilingCalculator/app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("No application JavaScript found")
          Path("/tmp/armstrong-app.js").write_text("\\n".join(scripts))
          if "leftEdgeGreen" in html or "rightEdgeGreen" in html:
              raise SystemExit("Old perimeter green-tee rule is still present")
          if "if(!isPerimeter||bayWidth<=.600001)" in html:
              raise SystemExit("Old perimeter green-tee drawing rule is still present")
          if "Armstrong Ceiling Calculator" not in html:
              raise SystemExit("Original calculator branding is missing")
          print("Original calculator HTML and corrected internal-only tee rule verified.")
          PY
          node --check /tmp/armstrong-app.js

      - name: Build original Android WebView project
        working-directory: ArmstrongCeilingCalculator
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK for delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp ArmstrongCeilingCalculator/app/build/outputs/apk/debug/app-debug.apk output/Armstrong_Ceiling_Calculator_v5.4.apk
          ls -lh output/Armstrong_Ceiling_Calculator_v5.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armstrong-Ceiling-Calculator-v5.4-APK
          path: output/Armstrong_Ceiling_Calculator_v5.4.apk
          if-no-files-found: error
