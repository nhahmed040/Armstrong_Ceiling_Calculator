name: Build Original Armstrong Ceiling Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ArmstrongCeilingCalculator/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out original project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate original web calculator JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("ArmstrongCeilingCalculator/app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("No application JavaScript found")
          Path("/tmp/armstrong-app.js").write_text("\\n".join(scripts))
          if "if(!isPerimeter||bayWidth<=.600001)" in html:
              raise SystemExit("Old perimeter green-tee drawing rule is still present")
          if "bayWidth>.600001" not in html or "leftEdgeGreen=first>.600001?1:0" not in html:
              raise SystemExit("Correct 600 mm plus remainder perimeter rule is missing")
          if "rightEdgeGreen=rightEdge>.600001?1:0" not in html:
              raise SystemExit("Right perimeter 600 mm plus remainder rule is missing")
          if "Armstrong Ceiling Calculator" not in html or "gridSvg" not in html:
              raise SystemExit("Original calculator branding or plan view is missing")
          print("Original calculator asset and corrected 600 mm plus remainder edge rule verified.")

      - name: Build original Android WebView project
        working-directory: ArmstrongCeilingCalculator
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK for delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp ArmstrongCeilingCalculator/app/build/outputs/apk/debug/app-debug.apk output/Armstrong_Ceiling_Calculator_v5.4.apk
          ls -lh output/Armstrong_Ceiling_Calculator_v5.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armstrong-Ceiling-Calculator-v5.4-APK
          path: output/Armstrong_Ceiling_Calculator_v5.4.apk
          if-no-files-found: error
